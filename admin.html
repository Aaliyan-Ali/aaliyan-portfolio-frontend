<!-- frontend/admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Aaliyan Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 font-['Inter']">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Login Form -->
        <div id="loginSection" class="bg-white rounded-xl shadow-lg p-8 max-w-md mx-auto mt-20">
            <h2 class="text-3xl font-bold text-center text-purple-700 mb-6">Admin Login</h2>
            <input type="email" id="adminEmail" placeholder="Email" class="w-full border rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
            <input type="password" id="adminPassword" placeholder="Password" class="w-full border rounded-lg px-4 py-2 mb-6 focus:outline-none focus:ring-2 focus:ring-purple-500">
            <button onclick="login()" class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition">Login</button>
        </div>

        <!-- Admin Dashboard (hidden initially) -->
        <div id="dashboardSection" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-purple-800">Admin Dashboard</h1>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">Logout</button>
            </div>

            <!-- Edit CV Section -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <h2 class="text-2xl font-bold mb-4">Edit CV Information</h2>
                <div id="cvEditForm" class="space-y-4">
                    <!-- Dynamic CV edit form -->
                    <div class="animate-pulse">Loading CV data...</div>
                </div>
                <button onclick="updateCV()" class="mt-4 bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">Save CV Changes</button>
            </div>

            <!-- Manage Projects Section -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Manage Projects</h2>
                    <button onclick="showAddProjectModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">+ Add New Project</button>
                </div>
                <div id="projectsList" class="space-y-4">
                    <div class="animate-pulse">Loading projects...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Project Modal -->
    <div id="projectModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
            <h3 id="modalTitle" class="text-2xl font-bold mb-4">Add Project</h3>
            <input type="hidden" id="editProjectId">
            <div class="space-y-3">
                <input type="text" id="projTitle" placeholder="Project Title" class="w-full border rounded-lg p-2">
                <textarea id="projShortDesc" placeholder="Short Description" rows="2" class="w-full border rounded-lg p-2"></textarea>
                <input type="text" id="projCardImage" placeholder="Card Image URL" class="w-full border rounded-lg p-2">
                <input type="text" id="projVideoUrl" placeholder="Video URL (mp4 or embed)" class="w-full border rounded-lg p-2">
                <input type="text" id="projImages" placeholder="Additional Images (comma separated URLs)" class="w-full border rounded-lg p-2">
                <textarea id="projFullExplanation" placeholder="Full Explanation" rows="5" class="w-full border rounded-lg p-2"></textarea>
                <input type="text" id="projTechnologies" placeholder="Technologies (comma separated)" class="w-full border rounded-lg p-2">
                <input type="text" id="projLiveUrl" placeholder="Live URL" class="w-full border rounded-lg p-2">
                <input type="text" id="projGithubUrl" placeholder="GitHub URL" class="w-full border rounded-lg p-2">
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="saveProject()" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700">Save</button>
                <button onclick="closeModal()" class="bg-gray-300 px-6 py-2 rounded-lg hover:bg-gray-400">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://your-backend-url.onrender.com/api';
        let authToken = localStorage.getItem('adminToken');

        async function login() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            try {
                const res = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('adminToken', data.token);
                    authToken = data.token;
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    loadAdminData();
                    Swal.fire('Success', 'Logged in successfully', 'success');
                } else {
                    Swal.fire('Error', data.message, 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'Login failed', 'error');
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            authToken = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
        }

        async function loadAdminData() {
            await loadCVForEdit();
            await loadProjectsForAdmin();
        }

        async function loadCVForEdit() {
            try {
                const res = await fetch(`${API_BASE}/cv`);
                const cv = await res.json();
                document.getElementById('cvEditForm').innerHTML = `
                    <div><label class="font-semibold">Name</label><input type="text" id="cvName" value="${cv.name}" class="w-full border rounded p-2"></div>
                    <div><label class="font-semibold">Email</label><input type="email" id="cvEmail" value="${cv.email}" class="w-full border rounded p-2"></div>
                    <div><label class="font-semibold">Phone</label><input type="text" id="cvPhone" value="${cv.phone}" class="w-full border rounded p-2"></div>
                    <div><label class="font-semibold">Address</label><input type="text" id="cvAddress" value="${cv.address}" class="w-full border rounded p-2"></div>
                    <div><label class="font-semibold">Profile</label><textarea id="cvProfile" rows="3" class="w-full border rounded p-2">${cv.profile}</textarea></div>
                    <div><label class="font-semibold">Image URL</label><input type="text" id="cvImageUrl" value="${cv.imageUrl}" class="w-full border rounded p-2"></div>
                    <div><label class="font-semibold">Skills (comma separated)</label><input type="text" id="cvSkills" value="${cv.skills.join(', ')}" class="w-full border rounded p-2"></div>
                    <div><label class="font-semibold">Experiences (JSON array)</label><textarea id="cvExperiences" rows="4" class="w-full border rounded p-2 font-mono text-sm">${JSON.stringify(cv.experiences, null, 2)}</textarea></div>
                    <div><label class="font-semibold">Educations (JSON array)</label><textarea id="cvEducations" rows="4" class="w-full border rounded p-2 font-mono text-sm">${JSON.stringify(cv.educations, null, 2)}</textarea></div>
                `;
            } catch (error) {
                document.getElementById('cvEditForm').innerHTML = '<div class="text-red-500">Error loading CV</div>';
            }
        }

        async function updateCV() {
            const updatedCV = {
                name: document.getElementById('cvName').value,
                email: document.getElementById('cvEmail').value,
                phone: document.getElementById('cvPhone').value,
                address: document.getElementById('cvAddress').value,
                profile: document.getElementById('cvProfile').value,
                imageUrl: document.getElementById('cvImageUrl').value,
                skills: document.getElementById('cvSkills').value.split(',').map(s => s.trim()),
                experiences: JSON.parse(document.getElementById('cvExperiences').value),
                educations: JSON.parse(document.getElementById('cvEducations').value)
            };
            try {
                const res = await fetch(`${API_BASE}/cv`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify(updatedCV)
                });
                if (res.ok) {
                    Swal.fire('Success', 'CV updated successfully', 'success');
                    loadCVForEdit();
                } else {
                    Swal.fire('Error', 'Failed to update CV', 'error');
                }
            } catch (error) {
                Swal.fire('Error', error.message, 'error');
            }
        }

        async function loadProjectsForAdmin() {
            try {
                const res = await fetch(`${API_BASE}/projects`);
                const projects = await res.json();
                const container = document.getElementById('projectsList');
                container.innerHTML = projects.map(proj => `
                    <div class="bg-gray-50 p-4 rounded-lg flex justify-between items-center">
                        <div>
                            <h3 class="font-bold">${proj.title}</h3>
                            <p class="text-sm text-gray-600">${proj.shortDescription.substring(0, 80)}...</p>
                        </div>
                        <div class="space-x-2">
                            <button onclick="editProject('${proj._id}')" class="bg-yellow-500 text-white px-3 py-1 rounded">Edit</button>
                            <button onclick="deleteProject('${proj._id}')" class="bg-red-500 text-white px-3 py-1 rounded">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('projectsList').innerHTML = '<div class="text-red-500">Error loading projects</div>';
            }
        }

        let currentEditId = null;
        function showAddProjectModal() {
            currentEditId = null;
            document.getElementById('modalTitle').innerText = 'Add Project';
            document.getElementById('editProjectId').value = '';
            document.getElementById('projTitle').value = '';
            document.getElementById('projShortDesc').value = '';
            document.getElementById('projCardImage').value = '';
            document.getElementById('projVideoUrl').value = '';
            document.getElementById('projImages').value = '';
            document.getElementById('projFullExplanation').value = '';
            document.getElementById('projTechnologies').value = '';
            document.getElementById('projLiveUrl').value = '';
            document.getElementById('projGithubUrl').value = '';
            document.getElementById('projectModal').classList.remove('hidden');
            document.getElementById('projectModal').style.display = 'flex';
        }

        async function editProject(id) {
            const res = await fetch(`${API_BASE}/projects/${id}`);
            const proj = await res.json();
            currentEditId = id;
            document.getElementById('modalTitle').innerText = 'Edit Project';
            document.getElementById('editProjectId').value = id;
            document.getElementById('projTitle').value = proj.title;
            document.getElementById('projShortDesc').value = proj.shortDescription;
            document.getElementById('projCardImage').value = proj.cardImage;
            document.getElementById('projVideoUrl').value = proj.videoUrl || '';
            document.getElementById('projImages').value = (proj.images || []).join(',');
            document.getElementById('projFullExplanation').value = proj.fullExplanation;
            document.getElementById('projTechnologies').value = (proj.technologies || []).join(',');
            document.getElementById('projLiveUrl').value = proj.liveUrl || '';
            document.getElementById('projGithubUrl').value = proj.githubUrl || '';
            document.getElementById('projectModal').classList.remove('hidden');
            document.getElementById('projectModal').style.display = 'flex';
        }

        async function saveProject() {
            const projectData = {
                title: document.getElementById('projTitle').value,
                shortDescription: document.getElementById('projShortDesc').value,
                cardImage: document.getElementById('projCardImage').value,
                videoUrl: document.getElementById('projVideoUrl').value,
                images: document.getElementById('projImages').value.split(',').map(s => s.trim()).filter(s => s),
                fullExplanation: document.getElementById('projFullExplanation').value,
                technologies: document.getElementById('projTechnologies').value.split(',').map(s => s.trim()),
                liveUrl: document.getElementById('projLiveUrl').value,
                githubUrl: document.getElementById('projGithubUrl').value
            };
            const id = document.getElementById('editProjectId').value;
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE}/projects/${id}` : `${API_BASE}/projects`;
            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify(projectData)
                });
                if (res.ok) {
                    Swal.fire('Success', `Project ${id ? 'updated' : 'added'} successfully`, 'success');
                    closeModal();
                    loadProjectsForAdmin();
                } else {
                    Swal.fire('Error', 'Operation failed', 'error');
                }
            } catch (error) {
                Swal.fire('Error', error.message, 'error');
            }
        }

        async function deleteProject(id) {
            const confirm = await Swal.fire({ title: 'Confirm?', text: 'Delete this project permanently?', icon: 'warning', showCancelButton: true });
            if (!confirm.isConfirmed) return;
            const res = await fetch(`${API_BASE}/projects/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${authToken}` } });
            if (res.ok) {
                Swal.fire('Deleted', 'Project removed', 'success');
                loadProjectsForAdmin();
            } else {
                Swal.fire('Error', 'Failed to delete', 'error');
            }
        }

        function closeModal() {
            document.getElementById('projectModal').classList.add('hidden');
            document.getElementById('projectModal').style.display = 'none';
        }

        // Auto-check token on load
        if (authToken) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            loadAdminData();
        }
    </script>
</body>
</html>
