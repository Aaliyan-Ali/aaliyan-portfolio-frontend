<!-- frontend/project-detail.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | Aaliyan Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-['Inter']">
    <header class="bg-white shadow-md sticky top-0 z-40">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold bg-gradient-to-r from-purple-600 to-purple-800 bg-clip-text text-transparent">Aaliyan Ali</a>
            <a href="index.html" class="text-gray-700 hover:text-purple-600 transition">← Back to Home</a>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div id="projectDetail" class="bg-white rounded-2xl shadow-xl p-6 md:p-10">
            <div class="animate-pulse text-center">Loading project details...</div>
        </div>
    </main>

    <footer class="bg-gray-900 text-white py-6 text-center mt-12">
        <p>&copy; 2026 Aaliyan Ali. All rights reserved.</p>
    </footer>

    <script>
        const API_BASE = 'aaliyan-portfolio-backend-production.up.railway.app';
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        async function loadProjectDetail() {
            if (!projectId) {
                document.getElementById('projectDetail').innerHTML = '<div class="text-red-500 text-center">No project ID specified.</div>';
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/projects/${projectId}`);
                if (!res.ok) throw new Error('Project not found');
                const project = await res.json();
                document.getElementById('projectDetail').innerHTML = `
                    <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">${project.title}</h1>
                    <div class="flex flex-wrap gap-4 mb-6">
                        ${project.technologies?.map(tech => `<span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-sm">${tech}</span>`).join('') || ''}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div>
                            ${project.videoUrl ? `
                                <video controls class="w-full rounded-lg shadow-md">
                                    <source src="${project.videoUrl}" type="video/mp4">
                                    Your browser does not support video.
                                </video>
                            ` : '<div class="bg-gray-200 h-64 rounded-lg flex items-center justify-center">No video available</div>'}
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            ${project.images?.map(img => `<img src="${img}" class="rounded-lg shadow-md h-40 w-full object-cover" alt="Project image">`).slice(0, 4).join('') || '<div class="col-span-2 text-gray-500">No additional images</div>'}
                        </div>
                    </div>
                    <div class="prose max-w-none mb-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-3">Full Explanation</h2>
                        <p class="text-gray-700 whitespace-pre-line">${project.fullExplanation}</p>
                    </div>
                    <div class="flex gap-4 pt-6 border-t">
                        ${project.liveUrl ? `<a href="${project.liveUrl}" target="_blank" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700">Live Demo →</a>` : ''}
                        ${project.githubUrl ? `<a href="${project.githubUrl}" target="_blank" class="border border-purple-600 text-purple-600 px-6 py-2 rounded-lg hover:bg-purple-50">GitHub →</a>` : ''}
                    </div>
                `;
            } catch (error) {
                document.getElementById('projectDetail').innerHTML = `<div class="text-red-500 text-center">Error: ${error.message}</div>`;
            }
        }

        loadProjectDetail();
    </script>
</body>
</html>
